<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML // 07</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        red: {
                            100: "#f0d5dc",
                            200: "#d9a0b0",
                            300: "#c97a8a",
                            400: "#a3324b",
                            500: "#800020",
                            600: "#5c0017",
                            700: "#40000f",
                        },
                        noir: {
                            950: '#09090b',
                            900: '#111114',
                            850: '#16161a',
                            800: '#1d1d22',
                            700: '#2a2a32',
                        },
                        crimson: {
                            400: '#a3324b',
                            500: '#800020',
                            600: '#5c0017',
                            950: '#1a0008',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #09090b;
            color: #f4f4f5;
            -webkit-tap-highlight-color: transparent;
            background-image: radial-gradient(rgba(128, 0, 32, 0.06) 1px, transparent 0);
            background-size: 28px 28px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide {
            animation: slideUp 0.28s ease-out forwards;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #800020; }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-red-600 selection:text-white">

    <header class="sticky top-0 z-30 bg-noir-950/90 backdrop-blur-md border-b border-zinc-800/80">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center gap-2.5">
                <span class="w-2.5 h-2.5 rounded-sm bg-red-500 inline-block"></span>
                <span class="font-display font-bold tracking-tight text-base sm:text-lg text-zinc-100">
                    HTML <span class="text-red-500 font-mono font-semibold">// 07</span>
                </span>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-3xl w-full mx-auto px-4 sm:px-6 py-8 sm:py-12 space-y-6 animate-slide">

        <section class="rounded-xl bg-noir-900 border border-zinc-800 p-5 sm:p-6 space-y-4">
            <h2 class="font-mono text-xs font-bold uppercase tracking-widest text-red-500">
                Matek
            </h2>

            <ul class="space-y-2.5">
                <li>
                    <a href="egyenlet.html"
                        class="group w-full px-5 py-4 rounded-lg bg-noir-950 border border-zinc-800 hover:border-red-500 transition-colors flex items-center justify-between gap-3">
                        <span class="font-display font-bold text-base sm:text-lg text-zinc-100 group-hover:text-white transition-colors">
                            Egyenlet...
                        </span>
                        <span class="font-mono text-sm text-zinc-500 group-hover:text-red-500 transition-colors">
                            →
                        </span>
                    </a>
                </li>
            </ul>
        </section>

    </main>

</body>
</html>
